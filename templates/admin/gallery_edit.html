{% extends "base.html" %}
{% block title %}Edit gallery image · Beamers Farm{% endblock %}
{% block content %}
<div class="admin-shell"><div class="container"><div class="admin-topbar compact-topbar"><div><a class="back-link" href="{{ url_for('admin.gallery') }}">← Back to Gallery</a><p class="eyebrow">Owner desk / content</p><h1>Edit gallery image.</h1></div></div>
<section class="admin-panel gallery-edit-panel"><div class="gallery-edit-preview"><img src="{{ gallery_image_url(image.image) }}" alt="{{ image.title }}"></div><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" maxlength="120" value="{{ image.title }}" required></label><label>Description<textarea name="description" maxlength="2000" rows="6">{{ image.description }}</textarea></label><label>Replace image <span class="form-note">Optional</span><input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><label>Display order<input type="number" name="sort_order" value="{{ image.sort_order }}" min="0" step="1"></label><div class="form-actions"><button class="button button-dark" type="submit">Save changes</button><a class="button button-outline" href="{{ url_for('admin.gallery') }}">Cancel</a></div></form></section>
</div></div>
{% endblock %}
