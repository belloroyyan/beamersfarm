{% extends "base.html" %}
{% block title %}Reset password · Beamers Farm{% endblock %}
{% block content %}<div class="container auth-shell"><section class="auth-card"><div class="auth-icon">BF</div><p class="eyebrow">Password recovery</p><h1>Choose a new password.</h1><p>Use at least 8 characters and keep it private.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label><button class="button button-dark button-full" type="submit">Save password <span>→</span></button></form></section></div>{% endblock %}
