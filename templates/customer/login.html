{% extends "base.html" %}
{% block title %}Sign in · Beamers Farm{% endblock %}
{% block content %}<div class="container auth-shell"><section class="auth-card"><div class="auth-icon">BF</div><p class="eyebrow">Customer account</p><h1>Welcome back.</h1><p>Sign in to see previous orders and use your saved delivery details.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_url }}"><label>Phone or email<input name="identifier" required autocomplete="username" value="{{ request.form.get('identifier','') }}"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-dark button-full" type="submit">Sign in <span>→</span></button></form><p class="form-note account-auth-links"><a class="text-link" href="{{ url_for('customer.forgot_password') }}">Forgot your password?</a> · <a class="text-link" href="{{ url_for('customer.register', next=next_url) }}">Create an account</a></p></section></div>{% endblock %}
