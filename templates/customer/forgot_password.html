{% extends "base.html" %}
{% block title %}Recover your account · Beamers Farm{% endblock %}
{% block content %}<div class="container auth-shell"><section class="auth-card"><div class="auth-icon">?</div><p class="eyebrow">Password recovery</p><h1>Verify your order.</h1><p>Without SMS or email costs, we verify recovery using the phone number on a delivered or picked-up order.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Phone number<input type="tel" name="phone" required placeholder="08012345678"></label><label>Completed order reference<input name="order_ref" required placeholder="Your UUID order reference"></label><button class="button button-dark button-full" type="submit">Continue <span>→</span></button></form><p class="form-note account-auth-links"><a class="text-link" href="{{ url_for('customer.login') }}">Return to sign in</a></p></section></div>{% endblock %}
