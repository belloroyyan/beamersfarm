<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23382f">
  <title>You're offline · Beamers Farm</title>
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container offline-shell">
    <section class="offline-panel" aria-labelledby="offline-title">
      <img class="offline-logo" src="/static/images/brand-mark.png" alt="Beamers Farm">
      <p class="eyebrow">Connection unavailable</p>
      <h1 id="offline-title">You’re offline.</h1>
      <p>Reconnect to browse current products and prices, place an order, or check delivery updates.</p>
      <p class="offline-note">Your order has not been submitted or saved offline. Please reconnect before trying again.</p>
      <a class="button button-dark" href="/">Try Beamers Farm again <span>→</span></a>
    </section>
  </main>
</body>
</html>
